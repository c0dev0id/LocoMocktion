name: Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  debug-build:
    if: startsWith(github.ref, 'refs/heads/claude/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  nightly:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/release.keystore"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        id: rename
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          OUT="app/build/outputs/apk/release/LocoMocktionApp-nightly-${SHORT_SHA}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "apk_path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Delete previous nightly release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag --repo "${{ github.repository }}" || true

      - name: Create rolling nightly tag at HEAD
        run: |
          git tag -f nightly
          git push origin nightly --force

      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          make_latest: "false"
          body: |
            Automated nightly build from `main` @ ${{ github.sha }}.
            Built: ${{ github.event.head_commit.timestamp }}.

            Not a stable release — for testing only.
          files: ${{ steps.rename.outputs.apk_path }}
